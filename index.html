<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050308">
    <title>梦幻库洛牌 / Dreamy Clow Cards</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="assets/vendor/three.min.js"></script>
    <script defer src="js/app.js?v=20260519-card-layout"></script>
</head>

<body>
    <div id="loading-screen" class="loading-screen">
        <div id="brand-title">梦幻库洛牌</div>
        <div id="brand-subtitle">Dreamy Clow Cards</div>
        <button id="magic-circle-btn" type="button" aria-label="启动库洛牌阵" disabled></button>
        <div id="loading-text">牌库连接中 (0/54)...</div>
        <div id="loading-subtext">正在准备运行版牌面</div>
        <div id="launch-options" class="launch-options interactive-ui" hidden>
            <button id="touch-start-btn" type="button" disabled>触摸/鼠标模式</button>
            <button id="gesture-start-btn" type="button" disabled>摄像头手势模式</button>
        </div>
        <div id="local-file-note" class="local-file-note" hidden>
            请用本地服务打开；浏览器会限制 file:// 纹理和摄像头权限。
        </div>
    </div>

    <div id="ui-layer">
        <div id="status-text" hidden>牌阵待命</div>

        <div id="mode-panel" class="interactive-ui" hidden>
            <button id="gesture-toggle" type="button" title="开启摄像头手势模式">手势</button>
            <span id="gesture-status" data-tone="idle">手势待机</span>
            <span id="quality-badge" aria-label="当前性能档位">标准</span>
        </div>

        <div id="cursor-ring"></div>

        <div id="webcam-container" hidden>
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="webcam-overlay" aria-hidden="true"></canvas>
        </div>

        <div id="history-tray" aria-label="最近抽取的卡牌"></div>
    </div>

    <noscript>
        <div class="fatal-message">这个页面需要启用 JavaScript 才能运行。</div>
    </noscript>
</body>

</html>
